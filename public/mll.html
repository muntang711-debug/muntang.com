<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="/language.js"></script>
  <meta name="theme-color" content="#090909">
  <meta name="description" content="Muntang Level List. Pointercrate 데몬리스트 1~150위와 베리파이 영상을 확인하세요.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="MLL · Muntang Level List">
  <meta property="og:description" content="Pointercrate 데몬리스트 1~150위">
  <meta property="og:url" content="https://muntang.com/mll">
  <meta property="og:image" content="https://muntang.com/og-image.png">
  <link rel="canonical" href="https://muntang.com/mll">
  <link rel="alternate" hreflang="ko" href="https://muntang.com/mll">
  <link rel="alternate" hreflang="en" href="https://muntang.com/en/mll">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/mll.css">
  <title>MLL · Muntang Level List</title>
  <script src="/mll.js" defer></script>
</head>
<body class="mll-page">
  <a class="skip-link" href="#ranking">순위 목록으로 건너뛰기</a>
  <div id="siteShell"></div>
  <main class="wrap mll-main" id="top">
    <section class="mll-intro" aria-labelledby="mllTitle">
      <div class="mll-title-line"><h1 id="mllTitle">MLL<span class="brand-dot">.</span></h1><p>Muntang Level List</p></div>
      <div class="mll-description"><p id="listDescription">Pointercrate 데몬리스트 1–150위</p><a class="original-list" href="https://pointercrate.com/demonlist/" target="_blank" rel="noopener noreferrer"><span id="originalListText">원본 리스트</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 17 17 7M6 7h11v11"/></svg></a></div>
    </section>
    <section class="ranking-section" id="ranking" aria-label="데몬리스트 순위">
      <div class="list-column">
        <div class="list-tools"><div class="list-meta"><p id="resultCount" role="status">불러오는 중…</p><time id="lastChecked" hidden></time></div><label class="level-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><span id="searchLabel" class="sr-only">레벨명, 업로더 또는 ID 검색</span><input id="levelSearch" type="search" placeholder="레벨 검색" autocomplete="off" maxlength="120"></label></div>
        <div class="list-notice" hidden><p id="listNotice" role="status"></p><button id="retrySync" type="button">다시 시도</button></div>
        <div class="list-labels" aria-hidden="true"><span id="rankLabel">영상</span><span id="levelLabel">순위 / 레벨 / 업로더</span></div>
        <ol id="demonRows" class="level-list" aria-label="1위부터 150위까지" aria-busy="true"></ol>
        <p id="emptyState" class="empty-state" role="status">데몬리스트를 불러오고 있습니다.</p>
      </div>
    </section>
    <noscript><p id="noScriptText">최신 데몬리스트를 불러오려면 JavaScript를 켜 주세요. <a href="https://pointercrate.com/demonlist/">Pointercrate에서 보기 ↗</a></p></noscript>
  </main>
  <footer class="footer"><div class="footer-inner wrap"><a class="footer-brand" href="/mll">MLL<span>.</span></a><div class="footer-right"><a id="mainSiteLink" href="/">문탕닷컴 ↗</a><a id="dataCredit" href="https://pointercrate.com/" target="_blank" rel="noopener noreferrer">순위 데이터: Pointercrate ↗</a></div></div></footer>
</body>
</html>
